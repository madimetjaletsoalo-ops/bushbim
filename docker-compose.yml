# Local services for development.
#   docker compose up -d
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: bushbim
      POSTGRES_PASSWORD: bushbim
      POSTGRES_DB: bushbim
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  # S3-compatible object storage for Document Control (used from backlog item 1)
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bushbim
      MINIO_ROOT_PASSWORD: bushbim-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
